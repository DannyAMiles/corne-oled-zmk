# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Show battery percentage as a number on the OLED (alongside the icon)
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Live words-per-minute on the central OLED (left half)
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# --- Power management ---
# Re-enable the external power rail toggle so ZMK can gate the OLED rail
# on idle. This is the same flag the LED experimentation set, but it's
# decoupled from RGB — enabling it does NOT turn the LEDs on (no RGB
# configs are enabled). Without this, the OLED keeps drawing on the rail
# even after "blank on idle," and the controller can't reach low-power
# sleep cleanly.
CONFIG_ZMK_EXT_POWER=y

# Deep sleep timeout — back to default 15 min. We tried 5 min in PR #4 but
# wake-from-deep-sleep takes a few hundred ms while BLE reconnects, and the
# first keypress in that window can be lost. The big battery win comes from
# CONFIG_ZMK_EXT_POWER above (powers the OLED rail off at the 30-second
# idle mark, separate from deep sleep), so loosening the deep-sleep timeout
# costs little battery but eliminates the missed-keypress-on-wake annoyance.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
